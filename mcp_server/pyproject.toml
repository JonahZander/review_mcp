[project]
name = "review-mcp-server"
version = "0.1.0"
description = "FastMCP server exposing google_reviews tools via the Model Context Protocol."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "uvicorn>=0.52.0,<1.0.0",
    # google_reviews runtime deps (not installed as a package, so listed here explicitly)
    "requests>=2.32.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.16.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
    # Stub for `requests`, used transitively when mypy follows imports into google_reviews/
    "types-requests>=2.32.0.20241016,<3.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
# google_reviews/ is a sibling package made importable via PYTHONPATH, not installed.
# Point mypy at the parent directory so it can resolve `google_reviews.*` imports.
mypy_path = ".."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
